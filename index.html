<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎲華語大富翁💰</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --p1: #FF4B5C;
      --p2: #2e86de;
      --sky-blue: #e0f2fe; /* 淡淡的晴空藍 */
      --btn-orange: #fb923c;
      --btn-border: #475569;
      --tile-bg: rgba(255, 255, 255, 0.8);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, var(--sky-blue) 0%, #bae6fd 100%);
      color: #334155;
      font-family: 'Noto Sans TC', sans-serif;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
    }

    /* 全域按鈕放大與美化 */
    .btn {
      background: var(--btn-orange);
      border: 3px solid var(--btn-border);
      border-radius: 20px; color: white;
      padding: 18px 45px; font-size: 1.6rem; font-weight: 900;
      cursor: pointer; margin: 12px; transition: 0.2s;
      box-shadow: 0 6px 0 var(--btn-border);
      display: inline-block; text-decoration: none;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--btn-border); }

    .screen {
      position: absolute; width: 100%; height: 100%;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px;
    }
    .screen.active { display: flex; }

    /* 標題與輸入框 */
    h1 { font-size: 4rem; margin: 10px 0; color: #0369a1; -webkit-text-stroke: 2px white; }
    input[type="text"] {
      padding: 15px; font-size: 1.4rem; border-radius: 15px; border: 3px solid var(--btn-border);
      width: 100%; max-width: 400px; text-align: center;
    }

    /* 遊戲核心介面調整 (防止切掉) */
    #game-container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
      padding: 5px;
    }
    #board {
      display: grid; background: rgba(255,255,255,0.4);
      padding: 8px; border-radius: 15px;
      border: 4px solid var(--btn-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      /* 動態調整高度以防被切 */
      max-height: 75vh; max-width: 95vw;
      aspect-ratio: 1/1;
    }

    /* 格子優化：只留 Emoji */
    .cell {
      position: relative; border: 1px solid rgba(0,0,0,0.1);
      background: var(--tile-bg);
      display: flex; align-items: center; justify-content: center;
    }
    .cell-ico { font-size: min(4vh, 2.5vw); transition: 0.3s; }
    .cell-num { position: absolute; top: 1px; left: 1px; font-size: 9px; color: #94a3b8; }
    .cell-rent { position: absolute; bottom: 1px; right: 2px; font-size: 10px; font-weight: bold; color: #ef4444; }

    /* 角色棋子 */
    .token { font-size: 1.8rem; z-index: 50; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

    /* HUD 狀態列 */
    .hud { width: 95%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; }
    .p-box { 
      background: white; border: 3px solid var(--btn-border); border-radius: 15px;
      padding: 10px 20px; min-width: 180px; box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
    }
    .p-box.active { border-color: #facc15; background: #fffbeb; transform: scale(1.05); }
    .p-name { font-weight: 900; font-size: 1.2rem; }
    .p-cash { color: #b45309; font-weight: bold; font-size: 1.4rem; }

    /* 問答視窗放大 */
    .modal-content {
      background: #f8fafc; border: 5px solid var(--btn-border);
      border-radius: 30px; width: 90%; max-width: 600px; padding: 40px;
      text-align: center; color: #1e293b;
    }
    .q-text { font-size: 2rem; font-weight: 900; margin-bottom: 30px; }
    .opt-btn {
      width: 100%; padding: 20px; font-size: 1.4rem; margin: 10px 0;
      border: 3px solid var(--btn-border); border-radius: 15px;
      background: white; cursor: pointer; font-weight: bold;
    }
    .opt-btn:hover { background: #e2e8f0; }

    /* 骰子區域 */
    #dice-section { display: flex; align-items: center; gap: 20px; }
    .die-face {
      width: 60px; height: 60px; background: white; border: 3px solid var(--btn-border);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; box-shadow: 0 4px 0 var(--btn-border);
    }
  </style>
</head>
<body>

  <div id="s-title" class="screen active">
    <h1>華語大富翁</h1>
    <div style="margin-top: 20px;">
      <button class="btn" onclick="pickDiff('easy')">🌱 簡單</button>
      <button class="btn" style="background: #60a5fa;" onclick="pickDiff('normal')">🎓 普通</button>
      <button class="btn" style="background: #f87171;" onclick="pickDiff('hard')">🔥 困難</button>
    </div>
  </div>

  <div id="s-mode" class="screen">
    <h2 id="mode-label" style="font-size: 2.5rem;">模式選擇</h2>
    <div style="display: flex; gap: 20px;">
      <button class="btn" style="background: #38bdf8;" onclick="pickMode('ai')">🤖 挑戰電腦</button>
      <button class="btn" style="background: #c084fc;" onclick="pickMode('pvp')">⚔️ 雙人對戰</button>
    </div>
    <button class="btn" style="background: #94a3b8; font-size: 1rem;" onclick="goTo('s-title')">返回</button>
  </div>

  <div id="s-names" class="screen">
    <h2 style="font-size: 2.5rem;">輸入大名</h2>
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <input type="text" id="n1" placeholder="玩家一">
      <input type="text" id="n2" placeholder="玩家二" class="p2-input">
    </div>
    <button class="btn" style="margin-top: 30px; background: #4ade80;" onclick="startGame()">開始冒險 🚀</button>
  </div>

  <div id="s-game" class="screen">
    <div id="game-container">
      <div class="hud">
        <div class="p-box" id="pp0">
          <div class="p-name">🦊 <span id="pnm0">玩家一</span></div>
          <div class="p-cash"><span id="pcn0">1000</span> 💰</div>
        </div>
        <div class="p-box" id="pp1">
          <div class="p-name">🤖 <span id="pnm1">電腦</span></div>
          <div class="p-cash" style="text-align: right;"><span id="pcn1">1000</span> 💰</div>
        </div>
      </div>

      <div id="board">
        </div>

      <div id="dice-section">
        <div id="die0" class="die-face">⚀</div>
        <div id="die1" class="die-face">⚀</div>
        <button class="btn" id="btn-roll" onclick="rollDice()">擲骰子</button>
      </div>
    </div>
  </div>

  <div id="qmodal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center;">
    <div class="modal-content">
      <div id="q-text" class="q-text">題目載入中...</div>
      <div id="q-opts"></div>
      <div id="q-res" style="font-size: 1.5rem; margin-top: 20px; font-weight: 900;"></div>
    </div>
  </div>

  <div id="s-win" class="screen">
    <h1 style="font-size: 5rem;">🏆</h1>
    <h2 id="w-name" style="font-size: 3rem;">玩家一 獲勝！</h2>
    <button class="btn" onclick="location.reload()">再玩一局</button>
  </div>

<script>
// --- 核心邏輯與題庫 (同前，僅修改視覺部分) ---
const QB = {
  riddle: [ {q:"一人一張口。",a:"合",w:["含","答","口"]}, {q:"兩人在內。",a:"肉",w:["內","囚","網"]}, {q:"哪個漢字要寫最久？",a:"朋",w:["友","好","鵬"]}, {q:"一隻狗有四張口。",a:"器",w:["哮","嚎","囂"]}, {q:"太陽的兒子。",a:"星",w:["旦","晨","昇"]} ],
  culture: [ {q:"下列何者是宋代以後主要的私學機構？",a:"A",opts:["(A)書院","(B)精舍","(C)國子監","(D)太學"]}, {q:"關於「清明上河圖」，下列何者正確？",a:"C",opts:["(A)完成於明朝","(B)以北京為題材","(C)顯示城市的物質進步","(D)突顯文人清談"]} ],
  idiom: [ {q:"「胸有成竹」現用來比喻什麼？",a:"B",opts:["(A)為人正直","(B)很有把握","(C)孤芳自賞","(D)內心空虛"]}, {q:"「破釜沉舟」與哪位歷史人物有關？",a:"B",opts:["(A)劉邦","(B)項羽","(C)韓信","(D)諸葛亮"]} ],
  general: [ {q:"「我會說華語」和「我能說華語」的區別？",a:"D",opts:["(A)語氣","(B)情感","(C)時間","(D)能力或條件"]}, {q:"「網紅」一詞的形成屬何種詞彙變化？",a:"A",opts:["(A)詞彙縮略","(B)詞素重組","(C)詞義擴大","(D)語義轉移"]} ]
};

let G = {
  diff: 'normal', mode: 'ai', turn: 0,
  players: [{name:'P1', coins:1000, pos:0, ico:'🦊'}, {name:'P2', coins:1000, pos:0, ico:'🤖'}],
  cellOwner: Array(40).fill(-1),
  cellLevel: Array(40).fill(0),
  gameOver: false
};

const WIN_TARGET = 3000;

function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function pickDiff(d) { G.diff = d; goTo('s-mode'); }
function pickMode(m) { 
  G.mode = m; 
  document.querySelector('.p2-input').style.display = (m === 'ai' ? 'none' : 'block');
  goTo('s-names'); 
}

function startGame() {
  G.players[0].name = document.getElementById('n1').value || '玩家一';
  G.players[1].name = G.mode === 'ai' ? '電腦' : (document.getElementById('n2').value || '玩家二');
  G.players[1].ico = G.mode === 'ai' ? '🤖' : '🐸';
  
  document.getElementById('pnm0').textContent = G.players[0].name;
  document.getElementById('pnm1').textContent = G.players[1].name;
  document.getElementById('pp1').querySelector('.p-name').innerHTML = `${G.players[1].ico} <span id="pnm1">${G.players[1].name}</span>`;

  buildBoard();
  goTo('s-game');
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const S = 11;
  board.style.gridTemplateColumns = `repeat(${S}, 1fr)`;
  board.style.gridTemplateRows = `repeat(${S}, 1fr)`;

  const qIco = G.diff === 'easy' ? '🔮' : (G.diff === 'hard' ? '🌟' : '🏛️');

  for (let i = 0; i < 40; i++) {
    const div = document.createElement('div');
    div.className = 'cell';
    const pos = getGridPos(i);
    div.style.gridRow = pos.r;
    div.style.gridColumn = pos.c;
    div.id = `cell-${i}`;

    let ico = qIco;
    if (i === 0) ico = '🏠';
    else if (i % 10 === 5) ico = '🎁';
    else if (i % 10 === 0) ico = '⏸';

    div.innerHTML = `<div class="cell-num">${i}</div><div class="cell-ico">${ico}</div><div id="tok-box-${i}" style="position:absolute;display:flex;gap:2px;"></div>`;
    board.appendChild(div);
  }
  updateTokens();
}

function getGridPos(i) {
  if(i<10) return {r:11, c:i+1};
  if(i<20) return {r:11-(i-10), c:11};
  if(i<30) return {r:1, c:11-(i-20)};
  return {r:(i-30)+1, c:1};
}

function updateTokens() {
  document.querySelectorAll('[id^="tok-box-"]').forEach(el => el.innerHTML = '');
  G.players.forEach((p, idx) => {
    const box = document.getElementById(`tok-box-${p.pos}`);
    box.innerHTML += `<span class="token">${p.ico}</span>`;
  });
}

function rollDice() {
  if(G.gameOver) return;
  const btn = document.getElementById('btn-roll');
  btn.disabled = true;
  
  let steps = Math.floor(Math.random() * 6) + 1;
  let d1 = Math.floor(Math.random() * 6) + 1;
  let d2 = Math.floor(Math.random() * 6) + 1;
  
  const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  document.getElementById('die0').textContent = faces[d1-1];
  document.getElementById('die1').textContent = faces[d2-1];

  movePlayer(G.turn, d1 + d2);
}

function movePlayer(pi, steps) {
  let p = G.players[pi];
  let count = 0;
  let timer = setInterval(() => {
    p.pos = (p.pos + 1) % 40;
    if(p.pos === 0) { p.coins += 200; updateUI(); }
    updateTokens();
    count++;
    if(count >= steps) {
      clearInterval(timer);
      handleLand(pi);
    }
  }, 200);
}

function handleLand(pi) {
  const p = G.players[pi];
  const pos = p.pos;
  if(pos === 0 || pos % 10 === 5 || pos % 10 === 0) {
    setTimeout(nextTurn, 1000);
  } else {
    const owner = G.cellOwner[pos];
    if(owner >= 0 && owner !== pi) {
      const rent = 100 * (G.cellLevel[pos] + 1);
      p.coins -= rent;
      G.players[owner].coins += rent;
      alert(`支付租金 ${rent}！`);
      updateUI();
      checkWin();
      nextTurn();
    } else {
      askQuestion(pi, pos);
    }
  }
}

function askQuestion(pi, pos) {
  const modal = document.getElementById('qmodal');
  modal.style.display = 'flex';
  const poolName = G.diff === 'easy' ? 'riddle' : (G.diff === 'hard' ? 'general' : (pos % 2 === 0 ? 'culture' : 'idiom'));
  const bank = QB[poolName];
  const q = bank[Math.floor(Math.random() * bank.length)];

  document.getElementById('q-text').textContent = q.q;
  const optsDiv = document.getElementById('q-opts');
  optsDiv.innerHTML = '';
  document.getElementById('q-res').textContent = '';

  let opts = q.opts ? q.opts : [q.a, ...q.w].sort(() => Math.random() - 0.5);
  let correctVal = q.a;

  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = o;
    b.onclick = () => {
      const isCorrect = q.opts ? (o.startsWith(`(${correctVal})`)) : (o === correctVal);
      if(isCorrect) {
        G.players[pi].coins += 200;
        if(G.cellOwner[pos] === pi) G.cellLevel[pos]++;
        else G.cellOwner[pos] = pi;
        document.getElementById('q-res').textContent = '✅ 答對了！佔領/升級成功！';
        document.getElementById(`cell-${pos}`).style.border = `4px solid ${pi === 0 ? 'var(--p1)' : 'var(--p2)'}`;
      } else {
        document.getElementById('q-res').textContent = '❌ 答錯了，下次努力！';
      }
      updateUI();
      checkWin();
      setTimeout(() => { modal.style.display = 'none'; nextTurn(); }, 1500);
    };
    optsDiv.appendChild(b);
  });
}

function updateUI() {
  document.getElementById('pcn0').textContent = G.players[0].coins;
  document.getElementById('pcn1').textContent = G.players[1].coins;
}

function nextTurn() {
  G.turn = 1 - G.turn;
  document.getElementById('pp0').classList.toggle('active', G.turn === 0);
  document.getElementById('pp1').classList.toggle('active', G.turn === 1);
  document.getElementById('btn-roll').disabled = false;
  if(G.mode === 'ai' && G.turn === 1) setTimeout(rollDice, 1000);
}

function checkWin() {
  G.players.forEach(p => {
    if(p.coins >= WIN_TARGET) {
      G.gameOver = true;
      document.getElementById('w-name').textContent = `${p.name} 獲勝！`;
      goTo('s-win');
    }
  });
}

</script>
</body>
</html>
